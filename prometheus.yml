global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'mirochain-node'
    static_configs:
      - targets: ['mirochain-node:8080']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'mirochain-miner'
    static_configs:
      - targets: ['mirochain-miner:8080']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
    metrics_path: '/nginx_status'
    scrape_interval: 10s
