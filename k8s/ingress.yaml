apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mirochain-ingress
  namespace: mirochain
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  rules:
  - host: mirochain.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mirochain-service
            port:
              number: 8080
      - path: /graphql
        pathType: Prefix
        backend:
          service:
            name: mirochain-service
            port:
              number: 8088
      - path: /graphiql
        pathType: Prefix
        backend:
          service:
            name: mirochain-service
            port:
              number: 8088
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: mirochain-service
            port:
              number: 8088
      - path: /webhooks/
        pathType: Prefix
        backend:
          service:
            name: mirochain-service
            port:
              number: 8088
      - path: /contracts/
        pathType: Prefix
        backend:
          service:
            name: mirochain-service
            port:
              number: 8083
      - path: /tokens/
        pathType: Prefix
        backend:
          service:
            name: mirochain-service
            port:
              number: 8084
      - path: /nfts/
        pathType: Prefix
        backend:
          service:
            name: mirochain-service
            port:
              number: 8085
      - path: /sidechains/
        pathType: Prefix
        backend:
          service:
            name: mirochain-service
            port:
              number: 8086
      - path: /channels/
        pathType: Prefix
        backend:
          service:
            name: mirochain-service
            port:
              number: 8087
