events {
    worker_connections 1024;
}

http {
    upstream mirochain {
        server mirochain-node:9080;
    }

    upstream mirochain-graphql {
        server mirochain-node:8088;
    }

    upstream mirochain-contracts {
        server mirochain-node:8083;
    }

    upstream mirochain-tokens {
        server mirochain-node:8084;
    }

    upstream mirochain-nfts {
        server mirochain-node:8085;
    }

    upstream mirochain-sidechains {
        server mirochain-node:8086;
    }

    upstream mirochain-channels {
        server mirochain-node:8087;
    }

    upstream mirochain-miner {
        server mirochain-miner:8080;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=graphql:10m rate=5r/s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Main API server
    server {
        listen 80;
        server_name localhost;

        # Health check
        location /health {
            proxy_pass http://mirochain/api/status;
            access_log off;
        }

        # GraphQL API
        location /graphql {
            limit_req zone=graphql burst=20 nodelay;
            proxy_pass http://mirochain-graphql/graphql;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # GraphiQL Playground
        location /graphiql {
            proxy_pass http://mirochain-graphql/graphiql;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Gateway
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://mirochain/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Webhooks
        location /webhooks/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://mirochain-graphql/webhooks/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Documentation
        location /docs {
            proxy_pass http://mirochain-graphql/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger JSON
        location /swagger.json {
            proxy_pass http://mirochain-graphql/swagger.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Contract API
        location /contracts/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://mirochain-contracts/api/contracts/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Token API
        location /tokens/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://mirochain-tokens/api/tokens/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # NFT API
        location /nfts/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://mirochain-nfts/api/nfts/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Sidechain API
        location /sidechains/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://mirochain-sidechains/api/sidechains/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # State Channel API
        location /channels/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://mirochain-channels/api/channels/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default route
        location / {
            proxy_pass http://mirochain/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Miner API server
    server {
        listen 81;
        server_name localhost;

        location / {
            proxy_pass http://mirochain-miner/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
